<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        :root { --gold: #d4af37; --bg: #020202; --text: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); direction: rtl; line-height: 1.6; }
        
        .header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); }
        .logo { font-size: 1.8rem; font-weight: bold; color: var(--text); text-decoration: none; }
        .logo span { color: var(--gold); }
        
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(4px);
            opacity: 0.5;
        }

        .play-overlay-btn {
            position: absolute;
            background: rgba(212, 175, 55, 0.95);
            color: #000;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 900;
            text-decoration: none;
            font-size: 1.3rem;
            text-align: center;
            animation: pulse-animation 2s infinite;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .play-overlay-btn small { font-size: 0.75rem; font-weight: bold; opacity: 0.8; margin-top: 4px; }

        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(212, 175, 55, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        }

        .fake-controls { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 10px; z-index: 5; }
        .progress-bar { width: 100%; height: 5px; background: #444; border-radius: 2px; }
        .progress-fill { width: 30%; height: 100%; background: var(--gold); }
        .time-text { font-size: 11px; color: #fff; margin-top: 5px; display: flex; justify-content: space-between; }

        h1 { color: var(--gold); font-size: 1.6rem; text-align: center; }
        .content-box { background: #111; padding: 20px; border-radius: 12px; }
        footer { text-align: center; padding: 40px; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

<header class="header">
    <!-- تم تغيير الرابط هنا ليؤدي للحلقة 22 -->

</header>

<main class="container">
    <h1>مسلسل حب ع ورق الحلقة 21 كاملة</h1>
    
    <div class="video-wrapper">
        <img src="https://nabddrama.github.io/images/os.webp" alt="بوستر المسلسل">
        
        <a href="https://www.taifdrama.online/2026/07/21_01231295586.html" class="play-overlay-btn">
            شاهد الحلقة 21 كاملة
            <small>مشاهدة مباشرة | جودة عالية HD</small>
        </a>

        <div class="fake-controls">
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="time-text">
                <span>00:00</span>
                <span>40:00</span>
            </div>
        </div>
    </div>

    <article class="content-box">
        <h2>ملخص الحلقة 21</h2>
        <p>تشهد الحلقة تصاعداً درامياً وتطورات مشوقة وجديدة بين الأبطال، ومواقف مميزة تجمع بين الكوميديا والرومانسية وصراع المشاعر المستمر.</p>
    </article>
</main>

<footer>
    نبض الدراما © 2026 - جميع الحقوق محفوظة
</footer>

</html>
